# Publishes a GitHub Release with Canvass-Local.zip (Canvass 2.0, PHP for Windows included).
# Runs when main changes (or by hand from the Actions tab). The version comes from package.json;
# if a release for that version already exists, nothing happens. Bump "version" to publish a new release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, curl, mbstring

      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release $TAG already exists — skipping."; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Run tests (Canvass 2.0)
        if: steps.v.outputs.exists == 'false'
        run: php canvass/tests/run.php

      - name: Build the local test package
        if: steps.v.outputs.exists == 'false'
        run: scripts/package-local.sh 8.2.36 dist

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/Canvass-Local.zip \
            --target "$GITHUB_SHA" \
            --title "Canvass ${{ steps.v.outputs.tag }}" \
            --notes-file docs/RELEASE-NOTES.md
