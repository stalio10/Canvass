# Publishes a GitHub Release with the portable Windows package.
# Runs when main changes (or by hand from the Actions tab). The version comes from package.json;
# if a release for that version already exists, nothing happens. Bump "version" to publish a new release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release $TAG already exists — skipping."; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Run tests
        if: steps.v.outputs.exists == 'false'
        run: npm test

      - name: Build Windows package
        if: steps.v.outputs.exists == 'false'
        run: scripts/package-windows.sh v22.23.5 dist

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/Canvass-Windows.zip \
            --target "$GITHUB_SHA" \
            --title "Canvass Lead Finder ${{ steps.v.outputs.tag }}" \
            --notes-file docs/RELEASE-NOTES.md
